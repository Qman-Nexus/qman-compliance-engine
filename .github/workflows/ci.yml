name: Secure CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality and Security Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout source code
        uses: actions/checkout@CHECKOUT_SHA
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@SETUP_PYTHON_SHA
        with:
          python-version-file: .python-version

      - name: Verify Python runtime
        run: |
          python --version
          python -c "import ssl; print(ssl.OPENSSL_VERSION)"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Lint source code
        run: |
          python -m ruff check .

      - name: Run unit tests
        run: |
          python -m pytest tests/ -v \
            --cov=compliance \
            --cov=policy_loader \
            --cov=exception_manager \
            --cov-report=term-missing

      - name: Audit production dependencies
        run: |
          python -m pip_audit -r requirements.txt

      - name: Audit development dependencies
        run: |
          python -m pip_audit -r requirements-dev.txt

            - name: Install verified Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "d23441a48e516b6c34aea4fa41551a30e30af803"
        run: |
          set -euo pipefail

          ASSET="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ASSET}"

          WORK_DIR=$(mktemp -d)
          cd "$WORK_DIR"

          curl --fail --silent --show-error \
            --location "$URL" \
            --output "$ASSET"

          printf '%s  %s\n' \
            "$GITLEAKS_SHA256" "$ASSET" \
            | sha256sum --check -

          tar -xzf "$ASSET" gitleaks

          mkdir -p "$HOME/.local/bin"

          install -m 0755 gitleaks \
            "$HOME/.local/bin/gitleaks"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Scan Git history for secrets
        run: |
          gitleaks version

          gitleaks git . \
            --log-opts="--all" \
            --redact=100 \
            --exit-code=1 \
            --no-banner
